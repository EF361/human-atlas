<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#18202c" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b565" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="480" rx="24" fill="url(#bg)" stroke="#26354a" stroke-width="2"/>
  <circle cx="650" cy="240" r="160" fill="#d8b565" opacity="0.08" filter="url(#glow)"/>
  <circle cx="650" cy="240" r="110" fill="none" stroke="#d8b565" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <text x="650" y="270" font-size="90" text-anchor="middle" font-family="system-ui, sans-serif">🧠</text>
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#d8b565" fill-opacity="0.2"/>
    <text x="65" y="21" fill="#d8b565" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">HUMAN ATLAS</text>
    <text x="0" y="90" fill="#ffffff" font-size="40" font-weight="800" font-family="system-ui, sans-serif">Nervous System</text>
    <text x="0" y="130" fill="#d8b565" font-size="16" font-weight="600" font-family="system-ui, sans-serif">171 pieces · BodyParts3D Model</text>
    <text x="0" y="180" fill="#94a3b8" font-size="17" font-family="system-ui, sans-serif" width="460">
      <tspan x="0" dy="0">Cerebrum, spinal cord, cranial nerves, and peripheral signaling.</tspan>
    </text>
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="220" height="44" rx="10" fill="#202c3d" stroke="#d8b565" stroke-width="1.5"/>
      <text x="110" y="27" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">🔍 Explore in 3D Atlas →</text>
    </g>
  </g>
</svg>